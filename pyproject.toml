[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "a-share-factor-lab"
version = "0.1.0"
description = "Reproducible A-share cross-sectional factor research"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.0"]

[project.scripts]
factorlab = "factorlab.cli:main"

[tool.setuptools.packages.find]
include = ["factorlab*"]
